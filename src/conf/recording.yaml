# Data-collection (LeRobot recording) configuration for the dual SO-101 rig.
#
# This file configures the episode-based recorder driven from the Quest handles
# (tool/meta_quest_teleopration.py --record). It is SEPARATE from the teleop
# tuning YAMLs (src/ik_conf/*): camera device indices are per-machine hardware
# wiring, not teleop tuning, and must be set for each rig.
#
# Every key is validated strictly at load time (common.config_parser
# .load_recording_config): a missing or unknown key is a hard error naming the
# offending key. British English throughout.

# LeRobotDataset-level settings (one dataset, one integer fps).
dataset:
  # Recording rate for the training-ready dataset (integer frames per second).
  # LeRobot supports exactly one fps per dataset; the full-rate control signals
  # live in the ~100 Hz sidecar parquet instead (see the sidecar section).
  fps: 30
  # Async image-writer threads spawned PER enabled camera. PNG encoding is
  # offloaded to these threads so the record loop never blocks on disk.
  image_writer_threads_per_camera: 2
  # Robot-type string stored in the dataset metadata (informational).
  robot_type: so101_dual

# Full-rate sidecar: a per-episode parquet at ~100 Hz with wall-clock
# timestamps, holding the complete control signals for offline analysis. It is
# stored inside the dataset folder (<root>/extra/) but is NOT part of the
# LeRobotDataset features, so it never reaches the policy.
sidecar:
  # Master switch; --no-sidecar on the command line overrides this to false.
  enabled: true
  # Target sampling rate (Hz) of the sidecar thread. ~100 Hz captures the
  # control signals well above the 30 Hz dataset rate.
  rate_hz: 100.0
  # When true, also record the hardware-frame joint goal (cmd_hw_*) alongside
  # the URDF-space command. Useful for debugging the HW<->URDF boundary.
  include_hw_frame_goal: true

# Central RGB-D camera (Intel RealSense). OPTIONAL: this whole section may be
# omitted on a rig without a depth camera. The colour stream is published as a
# normal observation.images.<rgb_name> video feature (like the UVC cameras);
# the aligned 16-bit depth stream is stored OUTSIDE the video encoder (a
# per-frame lossless PNG16 under <root>/extra/depth/<depth_name>/), because
# LeRobot's video features are 3-channel uint8 and would corrupt depth. The
# camera intrinsics, extrinsics and depth scale are written once per dataset
# to <root>/meta/realsense.json for replicability. --central-depth on the
# command line overrides "enabled".
realsense:
  enabled: false          # capture the central RGB-D camera
  serial: ""              # device serial ("" = first RealSense found)
  width: 640              # colour + depth width (px); depth is aligned to colour
  height: 480             # colour + depth height (px)
  fps: 30                 # stream frame rate (Hz); match the dataset fps
  align_to_color: true    # align depth into the colour frame (rs.align)
  rgb_name: central       # observation.images.<rgb_name> video feature
  depth_name: central_depth  # name of the 16-bit depth stream on disk
  lock_auto_exposure: true   # lock auto-exposure once settled (stable appearance)

# Camera streams. Each entry maps a stream NAME to its capture settings. The
# name becomes the LeRobotDataset feature key (observation.images.<name>).
# Device indices are PER-MACHINE PLACEHOLDERS — you MUST set the correct
# /dev/videoN index for each stream on your rig (a -1 device is only valid for
# a disabled stream). --enable-camera / --disable-camera override "enabled".
#
# Each stream also accepts an OPTIONAL "fourcc" key (the capture pixel format,
# default MJPG) which may be omitted. Do not set it to an uncompressed format
# such as YUYV for several simultaneous streams: one 640x480@30 YUYV stream needs
# ~18 MB/s, so a few of them exceed what the shared USB controllers can carry —
# the cameras then run well under their requested fps, lag tens of milliseconds
# behind the rest of the frame, and can drop off the bus mid-episode.
cameras:
  # Optional per-camera keys (either may be omitted; the defaults apply):
  #   fourcc:   capture pixel format, default MJPG. Compressed on the wire is
  #             required, not preferred: several uncompressed 640x480@30 streams
  #             exceed what the shared USB controllers deliver.
  #   exposure: fixed exposure in the driver's units, or 0 (default) to leave the
  #             camera's automatic exposure in charge. This is a FRAME-RATE knob:
  #             a camera cannot deliver frames faster than it exposes them, so
  #             automatic exposure lengthening in dim light silently drops the
  #             stream's rate. Measured on the wrist cameras: 300 -> 27.4 fps,
  #             400 -> 22.8, 500 -> 18.2 (500 is what automatic exposure chose in
  #             the collection lighting).
  #             TUNING: brightness is the only thing to trade below 300 -- every
  #             value from 20 to 300 measured the same 27.4 fps, so darkening an
  #             over-exposed stream costs no frame rate at all. Above 300 the
  #             rate starts falling, so treat 300 as the ceiling and tune
  #             downwards by eye. The two wrists differ because they are lit
  #             differently, which is why this is per camera.
  #   gain, brightness, contrast, saturation:
  #             the same contract -- a number, or null (default) to leave the
  #             camera's own setting alone. Gain brightens WITHOUT costing frame
  #             rate, so reach for it before lengthening exposure.
  #
  # Tune all of these by eye with `venv/bin/python tool/tune_cameras.py`, which
  # shows the streams live with their frame rate beside them and writes your
  # values back into this file (comments and all) when you press s.
  # Overhead / scene RGB camera. DISABLED by default: the current rig does not
  # record a scene view (re-enable here if one is wired).
  scene:
    enabled: false       # capture this stream
    device: 0            # PLACEHOLDER: /dev/video0 — set for your machine
    width: 640           # forced capture width (px); a warn-once resize applies
    height: 480          # forced capture height (px)
    fps: 30              # requested device frame rate (Hz)
    rotate180: false     # rotate the frame 180 deg (camera mounted upside down)
  # Central overhead RGB camera — a plain UVC camera (the rig no longer uses a
  # RealSense here, so this stream carries colour only, no depth). Keeps the
  # feature key observation.images.central, and is assigned by-path from
  # sensor_map.yaml (tool/test_sensor_rates.py --assign) like the wrist cameras.
  central:
    enabled: true
    device: 6            # PLACEHOLDER fallback: set for your machine
    width: 640
    height: 480
    fps: 30
    rotate180: false
  # Left wrist RGB camera (follower_1 = LEFT arm). The device index here is a
  # fallback: once this stream is assigned in src/conf/sensor_map.yaml
  # (tool/test_sensor_rates.py --assign) the recorder resolves it to that
  # stable /dev/v4l/by-path node instead, so replugging cannot reorder it.
  wrist_camera_left:
    enabled: true
    device: 2            # PLACEHOLDER fallback: set for your machine
    width: 640
    height: 480
    fps: 30
    rotate180: false
    exposure: 300        # fixed: automatic exposure pinned this stream to 18 fps
  # Right wrist RGB camera (follower_0 = RIGHT arm). By-path resolved from
  # sensor_map.yaml when assigned (see wrist_camera_left).
  wrist_camera_right:
    enabled: true
    device: 4            # PLACEHOLDER fallback: set for your machine
    width: 640
    height: 480
    fps: 30
    exposure: 150        # this wrist sits in more light than the left one
    rotate180: false
  # Tactile cameras 0..3 — HARDWARE NOT ATTACHED YET, disabled by default.
  # --tactile enables all four; set real device indices before enabling.
  tactile_0:
    enabled: false
    device: -1           # PLACEHOLDER: no device wired yet
    width: 640
    height: 480
    fps: 30
    rotate180: false
  tactile_1:
    enabled: false
    device: -1           # PLACEHOLDER: no device wired yet
    width: 640
    height: 480
    fps: 30
    rotate180: false
  tactile_2:
    enabled: false
    device: -1           # PLACEHOLDER: no device wired yet
    width: 640
    height: 480
    fps: 30
    rotate180: false
  tactile_3:
    enabled: false
    device: -1           # PLACEHOLDER: no device wired yet
    width: 640
    height: 480
    fps: 30
    rotate180: false

# Audible record cue. OPTIONAL (older maps omit it). A short sound plays when an
# episode starts recording and when it stops-saves, so the operator gets an
# audible signal without watching the terminal. Sound names resolve against
# src/common/recording/sounds/ when not absolute; playback is best-effort (falls
# back to the terminal bell if no player is found) and never blocks the record
# loop. --no-sound on the command line overrides "enabled".
audio:
  enabled: true          # play the start/stop cues
  start_sound: start.wav # played when an episode starts recording
  stop_sound: stop.wav   # played when an episode is stopped and saved
