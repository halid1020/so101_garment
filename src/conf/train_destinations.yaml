# Where a training run can be sent, and what that machine can carry.
#
# One entry per machine. The console's Training tab and tool/train_launch.py
# both read this file and nothing else: adding a GPU box is an entry here, not
# a code change. Every key is validated strictly at load time
# (common.training.destinations.load_destinations) -- a missing or unknown key
# is a hard error naming it.
#
# Keys, all required except `limits` and `partition`:
#
#   ssh       [user@]host, as SSH itself reads it -- an ~/.ssh/config alias is
#             the intended form, so the key, port and jump host stay in one
#             place. Both halves reach a command line unquoted, so a host that
#             could be read as an option or a second command is refused.
#   kind      slurm | ssh.  `slurm` submits an array through hpc/submit_real.sh
#             and asks squeue how it is going; `ssh` starts the driver directly
#             under nohup and watches a pid. This is the ONLY thing that differs
#             between the two paths -- the dataset, the manifest, the camera
#             views and the driver are identical.
#   repo      the so101_garment checkout on that machine.
#   scratch   where its HF_LEROBOT_HOME and SO101_OUTPUT_DIR live. `$USER` and
#             `~` are left alone and expand REMOTELY, in the login shell.
#   stage     where staged datasets go; `{scratch}` is substituted.
#   partition slurm only: the GPU partition (`sinfo -s`).
#   limits    per-policy ceilings MEASURED on that machine, not guessed. A row
#             asking for more is refused before anything is reserved.

create:
  ssh: create
  kind: slurm
  repo: ~/so101_garment
  scratch: /scratch/users/$USER
  stage: "{scratch}/hf_lerobot/local"
  partition: gpu
  # MEASURED on a 40 GB A100: pi05 at batch 8 raised torch.OutOfMemoryError at
  # 39.22 GiB; batch 4 sits at 34.02 GiB and ~0.49 s/step. LoRA shrinks the
  # optimiser state, not the activations of a 4.1B model reading three cameras.
  limits:
    pi05:
      batch: 4

thanos:
  ssh: thanos
  kind: ssh
  repo: ~/project/so101_garment
  scratch: ~/.cache/huggingface/lerobot
  stage: "{scratch}/local"
  # MEASURED on this card (24.5 GiB) with a FIVE-camera dataset
  # (fold-short-from-flattend-tactile, 65 episodes):
  #   act       batch 8   -> mem_gb 11.27 peak, 3.66 step/s, 8h34 for 80000
  #                            steps, final train loss 0.075
  #   diffusion batch 16  -> mem_gb 8.70, 4.79 step/s (resized to 180x240, so
  #                            it reads the cameras far smaller than act does)
  #   diffusion batch 8   -> 7.28 GB, 7.9 step/s, 395 W peak of a 480 W limit,
  #                            59 C, at EIGHT loader workers rather than 24
  #   pi05      batch 2   -> torch.OutOfMemoryError: 23.45 GiB of 23.55 in use,
  #                            97 MiB free, asking for 122 MiB more. Killed at
  #                            about two minutes, inside the Gemma MLP's
  #                            down_proj under gradient checkpointing, with
  #                            expandable_segments already on -- so this is
  #                            capacity, not fragmentation.
  #   pi05      batch 1   -> 20710 MiB, 365 W, 2.86 step/s, 30000 steps in
  #                            2h55, final train loss 0.113. THREE cameras
  #                            (central + the two gripper views), which is all
  #                            pi0.5 has slots for.
  # Memory was not the binding constraint for act or diffusion -- the largest of
  # those, act at batch 8, leaves better than half the card free -- and it is the
  # binding one for pi0.5. Hence the single limit below and nothing else: a
  # guessed number refuses rows that fit and admits rows that do not.
  #
  # BATCH 1 IS BATCH 1. lerobot-train has no gradient accumulation (there is no
  # such field in configs/train.py and nothing in the loop steps the optimiser
  # every N batches), so this run cannot be made equivalent to CREATE's batch 4
  # by any flag. Compare the two only with that in mind.
  #
  # WHAT DOES BIND HERE IS POWER, and it is a fact about the box rather than
  # the card. Every diffusion run started with the driver's default of one
  # loader worker per core (24 of them) took the WHOLE MACHINE down within
  # minutes -- at batch 32 in under a minute, at batch 16 in about six -- with
  # no shutdown record, no journal entry, no OOM and no Xid either time, which
  # is what a power cut looks like from software and what a panic or a thermal
  # trip does not. The diffusion row that DID train through, at batch 8, ran
  # with 8 workers.
  #
  # WHICH of the two reductions mattered is NOT isolated, and the worker half is
  # worse than unisolated -- it was not deliberate. The driver on that machine
  # takes its count from `nproc`, hpc/gpu_box_run.sh never passes --workers, and
  # SO101_LOADER_WORKERS did not exist there, so the 8 came from the launching
  # shell's CPU affinity rather than from anything asked for. It is read back
  # here from the run's OWN train_config.json, which is the only reason it is
  # known at all.
  #
  # Against that, two runs at the full 24 workers did NOT take the box down:
  # act at batch 8 (80000 steps, 8h34) and pi05 at batch 1 (30000 steps, 2h55).
  # Both are light readers -- roughly 150 and 9 video-frame decodes a second,
  # against diffusion's 750 at batch 16 -- so they narrow the suspect to decode
  # RATE rather than clearing the worker count. SO101_LOADER_WORKERS in
  # test/system/long_vla_real.sh is the knob for varying one alone, and it
  # reaches this machine only once that branch is pushed and pulled.
  #
  # This card is also SINGLE-TENANT in practice: hpc/gpu_box_run.sh holds a lock
  # so the matrix runs one row at a time, and a policy server left serving on it
  # takes its memory off the top of whatever these figures allow.
  limits:
    pi05:
      batch: 1

local:
  # The machine the console itself is running on. Not a lesser destination: the
  # same driver, the same lock, the same run directories and the same manifest,
  # with no ssh in front of the command. `repo: .` means THIS checkout, whatever
  # machine that is -- this console is meant to run on more than one.
  kind: local
  repo: .
  scratch: ~/.cache/huggingface/lerobot
  stage: "{scratch}/local"
  # A console started through setup.sh puts SO101_OUTPUT_DIR in the repo, so a
  # run started here writes beside the older ones rather than into the cache.
  # Both places are scanned when the runs on this machine are listed.
  outputs: "{repo}/outputs"
  # Deliberately empty, and it must stay that way. What this machine can carry
  # is asked of it (common.training.runs.local_capability) rather than written
  # down: this file is checked in, and a VRAM figure in it would be a fact about
  # whoever committed it. MEASURED here today: an RTX 3050 with 4 GB, which is
  # under the 8 GB the driver wants, so every row is refused unless the operator
  # asks for a CPU run outright.
  limits: {}
