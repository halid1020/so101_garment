# Where a training run can be sent, and what that machine can carry.
#
# One entry per machine. The console's Training tab and tool/train_launch.py
# both read this file and nothing else: adding a GPU box is an entry here, not
# a code change. Every key is validated strictly at load time
# (common.training.destinations.load_destinations) -- a missing or unknown key
# is a hard error naming it.
#
# Keys, all required except `limits` and `partition`:
#
#   ssh       [user@]host, as SSH itself reads it -- an ~/.ssh/config alias is
#             the intended form, so the key, port and jump host stay in one
#             place. Both halves reach a command line unquoted, so a host that
#             could be read as an option or a second command is refused.
#   kind      slurm | ssh.  `slurm` submits an array through hpc/submit_real.sh
#             and asks squeue how it is going; `ssh` starts the driver directly
#             under nohup and watches a pid. This is the ONLY thing that differs
#             between the two paths -- the dataset, the manifest, the camera
#             views and the driver are identical.
#   repo      the so101_garment checkout on that machine.
#   scratch   where its HF_LEROBOT_HOME and SO101_OUTPUT_DIR live. `$USER` and
#             `~` are left alone and expand REMOTELY, in the login shell.
#   stage     where staged datasets go; `{scratch}` is substituted.
#   partition slurm only: the GPU partition (`sinfo -s`).
#   limits    per-policy ceilings MEASURED on that machine, not guessed. A row
#             asking for more is refused before anything is reserved.

create:
  ssh: create
  kind: slurm
  repo: ~/so101_garment
  scratch: /scratch/users/$USER
  stage: "{scratch}/hf_lerobot/local"
  partition: gpu
  # MEASURED on a 40 GB A100: pi05 at batch 8 raised torch.OutOfMemoryError at
  # 39.22 GiB; batch 4 sits at 34.02 GiB and ~0.49 s/step. LoRA shrinks the
  # optimiser state, not the activations of a 4.1B model reading three cameras.
  limits:
    pi05:
      batch: 4

thanos:
  ssh: thanos
  kind: ssh
  repo: ~/project/so101_garment
  scratch: ~/.cache/huggingface/lerobot
  stage: "{scratch}/local"
  # MEASURED on this card (24.5 GiB) with a FIVE-camera dataset
  # (fold-short-from-flattend-tactile, 65 episodes):
  #   act       batch 8   -> mem_gb 11.27, updt_s 0.414, 16 smp/s
  #   diffusion batch 16  -> not yet measured; see below
  #   pi05      batch ?   -> not yet measured at five cameras. The 21.5-of-23.5
  #                          GiB figure often quoted for it was taken with
  #                          THREE, and activations scale with camera count.
  # Nothing is refused here yet because nothing measured has been exceeded: act
  # at batch 8 leaves better than half the card free. Add a limit when a real
  # ceiling is observed, not before -- a guessed number refuses rows that fit
  # and admits rows that do not.
  #
  # This card is also SINGLE-TENANT in practice: hpc/gpu_box_run.sh holds a lock
  # so the matrix runs one row at a time, and a policy server left serving on it
  # takes its memory off the top of whatever these figures allow.
  limits: {}

local:
  # The machine the console itself is running on. Not a lesser destination: the
  # same driver, the same lock, the same run directories and the same manifest,
  # with no ssh in front of the command. `repo: .` means THIS checkout, whatever
  # machine that is -- this console is meant to run on more than one.
  kind: local
  repo: .
  scratch: ~/.cache/huggingface/lerobot
  stage: "{scratch}/local"
  # A console started through setup.sh puts SO101_OUTPUT_DIR in the repo, so a
  # run started here writes beside the older ones rather than into the cache.
  # Both places are scanned when the runs on this machine are listed.
  outputs: "{repo}/outputs"
  # Deliberately empty, and it must stay that way. What this machine can carry
  # is asked of it (common.training.runs.local_capability) rather than written
  # down: this file is checked in, and a VRAM figure in it would be a fact about
  # whoever committed it. MEASURED here today: an RTX 3050 with 4 GB, which is
  # under the 8 GB the driver wants, so every row is refused unless the operator
  # asks for a CPU run outright.
  limits: {}
