# FILE: .pre-commit-config.yaml

# The four ported policies under src/so101_policies/{act,diffusion,pi05,fastwam}/
# are upstream LeRobot modules moved into this repo so we own and can edit them.
# They are deliberately kept byte-comparable to their source: that is what lets
# `diff` against ../lerobot stay reviewable, and what guarantees a checkpoint
# trained by either implementation loads into the other (identical module tree
# => identical state_dict keys). Reformatting them to this repo's black profile
# would destroy both properties for no gain, so the formatters skip them.
# Code we actually write -- so101_policies/{common,flowmatch,dreamzero}/ -- is
# linted like everything else.
# fastwam is here for the same reason and one more: it is ported from a commit
# NEWER than the pin, so its formatting is the only evidence that
# tool/port_policies.py --check is comparing like with like. black reformatted
# nine of its files the first time it was committed, and --check went red
# immediately -- which is the system working, but only because the check exists.
exclude: '^src/so101_policies/(act|diffusion|pi05|fastwam)/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=5000']

  - repo: https://github.com/psf/black
    rev: 23.3.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/PyCQA/isort
    rev: 5.12.0
    hooks:
      - id: isort
        args: ["--profile", "black"]

  - repo: https://github.com/PyCQA/flake8
    # >=7.1 needed on Python 3.12: older pycodestyle tokenizes inside
    # f-strings (PEP 701) and false-positives E221/E702/E713 on them
    rev: 7.1.1
    hooks:
      - id: flake8
        # E203: whitespace before ':' — conflicts with black's slice style
        args: ['--extend-ignore=E501,E231,E402,E203']

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.4.1
    hooks:
      - id: mypy
        args: ["--ignore-missing-imports", "--explicit-package-bases"]
        additional_dependencies: [types-PyYAML]

  # Fast unit tier gate: the pure-python/pinocchio tests run in ~2 s, so
  # they're cheap enough to guard every commit (integration/system tiers
  # are too slow/heavy for a hook — run them via `make`).
  - repo: local
    hooks:
      - id: unit-tests
        name: unit tests (make test-unit)
        entry: make test-unit
        language: system
        pass_filenames: false
