# FILE: mypy.ini
#
# The three ported policies under src/so101_policies/{act,diffusion,pi05}/ are
# upstream LeRobot modules moved here unchanged, and .pre-commit-config.yaml
# keeps them out of every formatter's file list for a stated reason: reformatting
# them would destroy the diff against ../lerobot that makes the port claim
# checkable.
#
# That exclude covers the FILE LIST and not the import graph. mypy follows
# imports, so the moment anything linted imports a port -- which the cropped
# variants do, being subclasses of them -- upstream's 40 type errors surface
# under our name and `make lint` fails on code we deliberately do not own.
#
# `follow_imports = skip` treats them as Any at the boundary instead: their
# errors are not ours to fix, and fixing them is exactly what we have promised
# not to do.
[mypy]
ignore_missing_imports = True
explicit_package_bases = True

# Both spellings on purpose. `--explicit-package-bases` with the repo root as
# the base makes mypy call these `src.so101_policies.*`, while everything at
# runtime imports them as `so101_policies.*`; a section matching only one of the
# two silently does nothing, which is how this was first written.
[mypy-src.so101_policies.act.*,so101_policies.act.*]
follow_imports = skip

[mypy-src.so101_policies.diffusion.*,so101_policies.diffusion.*]
follow_imports = skip

[mypy-src.so101_policies.pi05.*,so101_policies.pi05.*]
follow_imports = skip

[mypy-src.so101_policies.fastwam.*,so101_policies.fastwam.*]
follow_imports = skip
